{% extends "base.html" %}
{% block title %}{{ _('edit_product') }} — {{ _('site_name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow"><div class="card-body p-4">
            <h3 class="mb-4">{{ _('edit_product') }}</h3>
            <form method="post">
                <div class="mb-3"><label class="form-label">{{ _('product_name') }}</label><input type="text" name="name" class="form-control" value="{{ product.name }}" required></div>
                <div class="mb-3"><label class="form-label">{{ _('description') }}</label><textarea name="description" class="form-control" rows="4">{{ product.description or '' }}</textarea></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">{{ _('price_usd') }}</label><input type="number" name="price" class="form-control" step="0.01" min="0.5" value="{{ product.price_display() }}" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label">{{ _('stock') }}</label><input type="number" name="stock" class="form-control" min="0" value="{{ product.stock }}" required></div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if product.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">{{ _('keep_active') }}</label>
                </div>
                <button type="submit" class="btn btn-primary">{{ _('save_changes') }}</button>
                <a href="{{ url_for('seller_dashboard') }}" class="btn btn-secondary">{{ _('cancel') }}</a>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
