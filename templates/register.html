{% extends "base.html" %}
{% block title %}{{ _('register') }} — {{ _('site_name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">{{ _('register') }}</h3>

                <!-- Google Login -->
                <a href="{{ url_for('google_login') }}" class="btn btn-outline-dark w-100 mb-3 d-flex align-items-center justify-content-center gap-2" style="height:48px;">
                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    {{ _('login_with_google') }}
                </a>

                <div class="text-center text-muted my-3"><small>——— {{ _('or') }} ———</small></div>

                <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">{{ _('username') }}</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('email') }}</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('password') }}</label>
                        <input type="password" name="password" class="form-control" required minlength="8">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_seller" id="is_seller">
                        <label class="form-check-label" for="is_seller">{{ _('want_to_be_seller') }}</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ _('register') }}</button>
                </form>
                <p class="text-center mt-3 mb-0">{{ _('already_registered') }} <a href="{{ url_for('login') }}">{{ _('login') }}</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
